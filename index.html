<style>
/* Layout: full-height app. Map fills the screen; a left panel on PC becomes a pull-up sheet on phones; the customer card floats right on PC and rises from the bottom on phones. */
:root{
  --bg:#eef1ef; --surface:#ffffff; --surface-2:#f5f7f6; --ink:#1c2530; --muted:#5d6873; --line:#d5dbd8;
  --accent:#0e6a87; --accent-ink:#ffffff; --accent-soft:#dcedf2; --map-bg:#e4e9e5; --grid:#d3dad5; --ring:#8aa3ad;
  --pin-stroke:#ffffff; --shadow:0 6px 24px rgba(20,35,45,.16);
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --top-h:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a1f; --surface:#1d252c; --surface-2:#232d35; --ink:#e7ecef; --muted:#9aa8b3; --line:#33404a;
  --accent:#4fb3d1; --accent-ink:#0b1a20; --accent-soft:#1d3a45; --map-bg:#1a2228; --grid:#26323a; --ring:#557280;
  --pin-stroke:#10171c; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141a1f; --surface:#1d252c; --surface-2:#232d35; --ink:#e7ecef; --muted:#9aa8b3; --line:#33404a;
  --accent:#4fb3d1; --accent-ink:#0b1a20; --accent-soft:#1d3a45; --map-bg:#1a2228; --grid:#26323a; --ring:#557280;
  --pin-stroke:#10171c; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:2000;background:var(--surface)}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:340px 1fr}

/* top bar */
#top{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:1000}
#brand{font-weight:700;font-size:17px;letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;gap:8px}
#brand .mark{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);display:inline-block}
#searchWrap{flex:1 1 180px;min-width:0;position:relative}
#search{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:0 12px;font-size:16px}
#hits{position:absolute;left:0;right:0;top:44px;z-index:1600;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow-y:auto;padding:4px 10px 8px}
#hits[hidden]{display:none}
#list:empty{border-top:none}
#dataState:empty{display:none}
/* 行動記録 */
.recblk .row{display:flex;gap:6px;flex-wrap:wrap}
.recblk .btn{height:36px;font-size:13px;padding:0 10px}
.reclist{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.reclist li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed var(--line)}
.reclist .d{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.reclist .t{flex:1;min-width:0}
.reclist .ops{display:flex;gap:4px}
.reclist .ops button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;font-size:12px;padding:2px 6px;cursor:pointer}
.recstate{font-size:12px;color:var(--muted)}
#recForm{position:fixed;inset:0;z-index:4000;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#recForm[hidden]{display:none}
#recForm form{background:var(--surface);color:var(--ink);width:min(520px,100%);max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
@media (min-width:861px){#recForm{align-items:center}#recForm form{border-radius:16px}}
#recForm h3{margin:0;font-size:17px}
#recForm label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
#recForm input,#recForm select,#recForm textarea{height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:0 10px;font-size:16px;font-weight:400}
#recForm textarea{height:64px;padding:8px 10px}
#recForm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#recForm .seg{display:flex;gap:6px;flex-wrap:wrap}
#recForm .seg label{flex-direction:row;align-items:center;gap:6px;font-weight:400;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
#recForm .seg input{height:auto}
#recForm .acts{display:flex;gap:8px;justify-content:flex-end}
#recForm .applOnly[hidden]{display:none}
/* our own date text (the browser's date box showed an empty weekday); the real input sits invisibly on top so a tap opens its picker */

/* house labels (zoomed in): logos left of the pin, name to the right, like the My Maps layers */
.lab-wrap{background:none;border:none}

.lab::before{content:"";position:absolute;left:calc(-18px / var(--s,1));top:calc(-18px / var(--s,1));width:calc(36px / var(--s,1));height:calc(36px / var(--s,1));border-radius:50%}

.lb-left,.lb-left .r{pointer-events:none}.lb-left i,.lb-left svg{pointer-events:auto}

.addr{font-size:14px}
.links{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

.appl{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:baseline;font-size:14px}

<script>
(() => {
'use strict';
const STORE = { name: 'お店（店頭販売）', lat: 33.2109965, lng: 130.5425786 };
const TODAY = new Date();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const normQ = s => String(s ?? '').normalize('NFKC').replace(/[\s　\-‐ー−()（）]/g, '').toLowerCase();
const normStaff =s => String(s ?? '').replace(/[\s　]+/g, ' ').trim();
const GREY = '#9aa3ab';
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- colour dimensions ---------- */
// CP target thresholds, same as the My Maps layers: 炊飯器 8年 / レンジ 10年 / IH 12年
// 案内 thresholds (years); 冷蔵庫・洗濯機 follow the CP columns of 【毎日③】, テレビ has none there so 10 is a placeholder
const TH = { '炊飯器':8, 'レンジ':10, 'IH':12, 'テレビ':10, '冷蔵庫':10, '洗濯機':8, '給湯器':15 };
const OVER = '#3fd8e8', UNDER = '#e3262b';
const ageOrder = cat => [`${TH[cat]}年以上`, `${TH[cat]}年未満`, '所有なし'];
const ageCols = cat => ({ [`${TH[cat]}年以上`]:OVER, [`${TH[cat]}年未満`]:UNDER, '所有なし':GREY });
// an appliance without a delivery date (owned elsewhere, seen on a visit) carries its age class from the カスタム column
const isOver = (cat, a) => a.date ? yearsSince(a.date) >= (TH[cat] || 8) : !!a.over;
const ageCol = (cat, a) => isOver(cat, a) ? OVER : UNDER;
// staff are shown by one-letter aliases; real names are matched by hash only, so the page itself carries no names
const STAFF = ['ト','タ','テ','ヤ','ミ'];
const STAFF_COL = {'ト':'#e53de8','タ':'#1a1ae6','テ':'#6fd13d','ヤ':'#b0653a','ミ':'#9c9c9c'};
const STORE_STAFF = 'ミ';
const STAFF_HASH = { 3799823507:'ト', 752748626:'タ', 1598834499:'テ', 295177741:'ヤ' };
const fnv = s => { let x = 0x811c9dc5; for (const ch of s) x = Math.imul(x ^ ch.charCodeAt(0), 0x01000193) >>> 0; return x; };
const squash = s => String(s ?? '').replace(/[\s　]+/g, '').replace(/彌/g, '弥');
function staffAlias(s) {
  const n = squash(s); if (!n) return '';
  if (STAFF.includes(n)) return n;
  if (/店頭/.test(n)) return STORE_STAFF;
  return STAFF_HASH[fnv(n)] || normStaff(s);
}
// カスタム like "<氏名>3見込み": find a staff name at the start
function staffFromCustom(s) {
  const n = squash(s);
  for (let len = 2; len <= Math.min(8, n.length); len++) { const a = STAFF_HASH[fnv(n.slice(0, len))]; if (a) return a; }
  return /店頭/.test(n) ? STORE_STAFF : '';
}
const APPL = { rice:'炊飯器', range:'レンジ', ih:'IH', tv:'テレビ', fridge:'冷蔵庫', washer:'洗濯機', heater:'給湯器' };

};
const EXTRA = ['#5b7083','#a0522d','#6b8e23','#4682b4','#9370db','#cd5c5c'];
function colorOf(dim, v) {

/* ---------- dates & ages ---------- */
function parseDate(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  if (typeof v === 'number' || /^\d{5}(\.\d+)?$/.test(String(v).trim())) {   // Excel serial
    const n = Number(v); if (n < 20000 || n > 80000) return null;
    return new Date(Math.round((n - 25569) * 86400000));
  }
  const s = String(v).trim().replace(/[年月]/g, '/').replace(/日/, '').replace(/-/g, '/');
  let m = s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);       // m/d/yyyy
  if (m) return new Date(+m[3], +m[1] - 1, +m[2]);
  const d = new Date(s); return isNaN(d) ? null : d;
}
const fmtDate = d => d ? `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}` : '';
const yearsSince = d => (TODAY - d) / (365.2425 * 86400000);
function fmtAge(d) {
  const months = Math.floor(yearsSince(d) * 12);
  return `${Math.floor(months / 12)}年${months % 12}か月`;
}
function bucketOf(y) { return y >= 12 ? '12年以上' : y >= 10 ? '10〜12年' : y >= 8 ? '8〜10年' : '8年未満'; }
// 黄色の帯 (seen in person): the 廃棄日付 column holds the date the appliance was checked; a check on or after the
// date set in the panel counts, as does ○ in a カスタム column
let checkSince = null;
try { const v = localStorage.getItem('yame-check-since'); if (v) checkSince = new Date(v + 'T00:00:00'); } catch {}
const checkedOn = a => { const d = a.checked || a.disposed || null; return a.recChecked && (!d || a.recChecked > d) ? a.recChecked : d; };   // recChecked: 所有確認 entered on the map
const isMaru = a => !!a.maru || (!!checkedOn(a) && (!checkSince || checkedOn(a) >= checkSince));
function currentAppliance(c, cat) {
  const list = (c.appl[cat] || []).filter(a => a.date || a.over != null);
  list.sort((a, b) => (b.date || 0) - (a.date || 0));
  return list[0] || null;
}
function ageBucket(c, cat) {
  const a = currentAppliance(c, cat);
  if (!a) return '所有なし';
  return isOver(cat, a) ? `${TH[cat]}年以上` : `${TH[cat]}年未満`;
}

/* ---------- data store & import ---------- */
let customers = new Map();
let markers = new Map();
let sources = [];
let isSample = true;

function pick(row, names) {
  for (const n of names) { const v = row[n]; if (v != null && String(v).trim() !== '') return v; }
  return '';
}
function parseLatLng(row) {
  const z = String(pick(row, ['座標', '緯度経度']) || '');
  let m = z.match(/(-?\d+(?:\.\d+)?)\s*[,，、\s]\s*(-?\d+(?:\.\d+)?)/);
  if (m) return [+m[1], +m[2]];
  const lat = parseFloat(pick(row, ['緯度'])), lng = parseFloat(pick(row, ['経度']));
  return isFinite(lat) && isFinite(lng) ? [lat, lng] : null;
}
function stageOf(kind) {
  if (/見込/.test(kind)) return '見込み';
  if (/推進/.test(kind)) return '推進';
  if (/チラシ/.test(kind)) return 'チラシ';
  return 'その他';
}
const STAGE_RANK = { '見込み':4, '推進':3, 'チラシ':2, 'その他':1, '接点なし':0 };
function catOf(prefix) {
  if (/炊飯/.test(prefix)) return '炊飯器';
  if (/レンジ|オーブン/.test(prefix)) return 'レンジ';
  if (/IH|ＩＨ|クッキング|コンロ|熱源/i.test(prefix)) return 'IH';
  return prefix.replace(/\d+$/, '') || 'その他';
}

// the all-customer ownership file (【毎日③】所有azyamedata): base list, coordinates, ranks and appliances
const isMasterFile = name => /所有azyamedata/i.test(name);
function ingest(rows, fileName) {
  const visitFile = /訪問/.test(fileName);
  const enrichOnly = isMasterFile(fileName);
  let used = 0;
  for (const raw of rows) {
    const row = {};
    for (const k in raw) row[String(k).replace(/[\s　]/g, '')] = raw[k];
    const code = String(pick(row, ['顧客コード', '顧客CD', '顧客番号'])).trim();
    if (!code) continue;
    // the ownership file brings everyone except ランク R (the same people ① and Sランク used to bring)
    if (enrichOnly && !customers.has(code) && String(row['ランク'] ?? '').normalize('NFKC').trim().toUpperCase() === 'R') continue;
    used++;
    let c = customers.get(code);
    if (!c) { c = { code, name:'', addr:'', addr2:'', lat:null, lng:null, rank:'', rfm:'', events:[], visits:[], appl:{}, keys:new Set() }; customers.set(code, c); }
    const name = pick(row, ['顧客名称', '顧客名', '氏名']); if (name) c.name = String(name).trim();
    // RFM files carry the address in 結合済み instead of 住所
    let addr = pick(row, ['住所']);
    if (!addr) { const j = String(pick(row, ['結合済み', '住所結合'])); if (/[都道府県市区町村]|\d+-\d+/.test(j)) addr = j; }
    if (addr) c.addr = String(addr).trim();
    const addr2 = pick(row, ['補記住所']); if (addr2) c.addr2 = String(addr2).trim();
    // phone numbers (any column named 電話 / TEL / 携帯), kept as digits for the 下4桁 search
    for (const k in row) if (/電話|TEL|携帯/i.test(k)) {
      const d = String(row[k] ?? '').normalize('NFKC').replace(/\D/g, '');
      if (d.length >= 4) (c.tels ||= new Set()).add(d);
    }
    const ll = parseLatLng(row); if (ll) [c.lat, c.lng] = ll;
    const rank = pick(row, ['顧客ランク区分', '顧客ランク']); if (rank) c.rank = String(rank).normalize('NFKC').trim().toUpperCase();
    const rfm = pick(row, ['RFMランク区分', 'RFMランク', 'RFM']); if (rfm) c.rfm = String(rfm).normalize('NFKC').trim().toUpperCase();   // the お店誌 file writes ranks in full-width (Ａ)

    // contacts and visits
    const kind = String(pick(row, ['接点内容区分', '接点内容'])).trim();
    const custom = String(pick(row, ['カスタム'])).trim();
    const date = parseDate(pick(row, ['接点日', '訪問日']));
    const staffOf = () => staffAlias(pick(row, ['担当者名', '担当者'])) || staffFromCustom(custom);
    const isCatalog = /お店誌|特選品/.test(fileName + ' ' + kind + ' ' + custom);
    if (isCatalog) { c.catalogTarget = true; const st = staffOf(); if (st) c.catalog = st; }
    else if (kind || date) {
      const staff = staffOf();
      const isVisit = /訪問/.test(kind) || /訪問/.test(custom) || visitFile;
      const key = [isVisit ? 'v' : 'e', fmtDate(date), staff, kind].join('|');
      if (!c.keys.has(key)) {
        c.keys.add(key);
        (isVisit ? c.visits : c.events).push({ date, staff, kind: kind || (isVisit ? '訪問' : ''), custom });
      }
    }

    // appliances: columns like 炊飯器1品番 / 炊飯器1納品日付 / 炊飯器1設置場所区分 / 炊飯器1廃棄日付
    const groups = {};
    for (const k in row) {
      const m = k.match(/^(.+?)(\d*)(品番|納品日付|納品日|設置場所区分|設置場所|廃棄日付|自他)$/);
      if (!m || m[1] === '顧客') continue;
      if ((m[2] && m[2] !== '1') || /サブ$/.test(m[1])) continue;   // only the main unit (…1 columns): not テレビ2〜5 or サブ
      const g = groups[m[1] + m[2]] ||= { cat: catOf(m[1]) };
      const f = m[3].startsWith('品番') ? 'model' : m[3].startsWith('納品') ? 'date' : m[3].startsWith('設置') ? 'place' : m[3] === '自他' ? 'store' : 'disposed';
      g[f] = row[k];
    }
    const dated = new Set();
    for (const g of Object.values(groups)) {
      const d = parseDate(g.date); const model = String(g.model ?? '').trim();
      if (!d && !model) continue;
      const key = ['a', g.cat, model, fmtDate(d)].join('|');
      if (c.keys.has(key)) continue;
      c.keys.add(key);
      (c.appl[g.cat] ||= []).push({ model, date: d, place: String(g.place ?? '').trim(), store: String(g.store ?? '').trim(), checked: parseDate(g.disposed), maru: /[○〇◯]/.test(custom) });
      if (d) dated.add(g.cat);
    }
    // カスタム like "8年以上○": ○ = ownership confirmed by eye; no delivery date needed
    const am = custom.match(/(\d+)\s*年\s*(以上|未満)/);
    if (am) {
      const fileCat = /炊飯/.test(fileName) ? '炊飯器' : /レンジ/.test(fileName) ? 'レンジ' : /IH|ＩＨ|クッキング/i.test(fileName) ? 'IH'
        : Object.keys(TH).find(k => TH[k] === +am[1]);
      if (fileCat && !dated.has(fileCat)) {
        const maru = /[○〇◯]/.test(custom), over = am[2] === '以上';
        const key = ['a', fileCat, 'seen', over, maru].join('|');
        if (!c.keys.has(key)) { c.keys.add(key); (c.appl[fileCat] ||= []).push({ model: '', date: null, place: '', disposed: null, over, maru }); }
      }
    }
  }
  return used;
}

function finalize() {
  for (const c of customers.values()) {
    const all = [...c.events, ...c.visits].filter(e => e.staff);
    all.sort((a, b) => (b.date || 0) - (a.date || 0));
    c.staff = all.length ? all[0].staff : '';
    c.stage = c.events.reduce((best, e) => { const s = stageOf(e.kind); return STAGE_RANK[s] > STAGE_RANK[best] ? s : best; }, '接点なし');
    c.vals = {};
    for (const k in DIMS) c.vals[k] = DIMS[k].get(c);
    c.search = normQ(c.name);
  }
}

/* ---------- file reading ---------- */
function decodeText(buf) {
  const u8 = new Uint8Array(buf);
  if (u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return new TextDecoder('utf-8').decode(u8.subarray(3));
  try { return new TextDecoder('utf-8', { fatal: true }).decode(u8); }
  catch { return new TextDecoder('shift_jis').decode(u8); }   // 店クラウドV / Excel CSV
}
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',' || ch === '\t') { row.push(f); f = ''; }
    else if (ch === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (ch !== '\r') f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function arraysToObjects(arr) {
  let h = arr.findIndex((r, i) => i < 15 && r.some(v => /顧客コード|顧客CD|顧客番号/.test(String(v).replace(/[\s　]/g, ''))));
  let codeFirst = false;
  if (h < 0) {   // some sheets lose the 顧客コード heading (e.g. "ra"); use the first column when the row still has 顧客名称 or 座標
    h = arr.findIndex((r, i) => i < 15 && r.some(v => /^(顧客名称|顧客名|座標)$/.test(String(v).replace(/[\s　]/g, ''))));
    if (h < 0) return null;
    codeFirst = true;
  }
  const head = arr[h].map(v => String(v ?? '').trim());
  if (codeFirst) head[0] = '顧客コード';
  // keep only the columns the map uses (the ownership file has 233; this makes reading it much faster)
  const keep = head.map((k, i) => [k.replace(/[\s　]/g, ''), i]).filter(([k]) => k && (
    /顧客コード|顧客CD|顧客番号|顧客名|氏名|住所|座標|緯度|経度|ランク|RFM|担当|接点|訪問|カスタム|結合|電話|TEL|携帯/i.test(k) ||
    (/^(.+?)(1?)(品番|納品日付|納品日|設置場所区分|設置場所|廃棄日付|自他)$/.test(k) && !/サブ\d|[2-9]\d*(品番|納品|設置|廃棄|自他)/.test(k))));
  const out = [];
  for (let j = h + 1; j < arr.length; j++) {
    const r = arr[j];
    if (!r.some(v => v !== '' && v != null && String(v).trim() !== '')) continue;
    const o = {}; for (const [k, i] of keep) o[head[i]] = r[i] ?? ''; out.push(o);
  }
  return out;
}
let xlsxReady = null;
function loadXLSX() {
  return xlsxReady ||= new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res(window.XLSX); s.onerror = () => { xlsxReady = null; rej(new Error('Excel読み込み部品を取得できませんでした')); };
    document.head.appendChild(s);
  });
}
async function readFile(file) {
  const buf = await file.arrayBuffer();
  if (/\.xlsx?$/i.test(file.name)) {
    const XLSX = await loadXLSX();
    // first sheet only, no formatted text: about twice as fast on the big files (dates arrive as Excel serial numbers, parseDate handles them)
    const wb = XLSX.read(buf, { type: 'array', dense: true, sheets: 0, cellText: false, cellHTML: false });
    // only the leftmost sheet is the map data; other sheets are working copies
    const arr = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: true });
    return arraysToObjects(arr) || [];
  }
  return arraysToObjects(parseCSV(decodeText(buf))) || [];
}
/* ---------- remember the last import on this device (IndexedDB, never leaves the browser) ---------- */
function idb(mode, fn) {
  return new Promise((res, rej) => {
    let rq; try { rq = indexedDB.open('yame-map', 1); } catch (e) { rej(e); return; }
    rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
    rq.onerror = () => rej(rq.error);
    rq.onsuccess = () => {
      const db = rq.result, tx = db.transaction('kv', mode), r = fn(tx.objectStore('kv'));
      tx.oncomplete = () => { db.close(); res(r && r.result); };
      tx.onerror = tx.onabort = () => { db.close(); rej(tx.error); };
    };
  });
}
const saveData = () => idb('readwrite', s => s.put({ customers, sources, savedAt: new Date() }, 'last')).catch(() => {});
const loadData = () => idb('readonly', s => s.get('last')).catch(() => null);
const clearData = () => idb('readwrite', s => s.delete('last')).catch(() => {});
let savedAt = null;
let freshNext = true;   // the first import after opening replaces the remembered data instead of adding to it

async function importFiles(files) {
  if (!files.length) return;
  if (isSample || freshNext) { customers = new Map(); sources = []; isSample = false; }
  freshNext = false;
  let rows = 0; const bad = [];
  files = [...files].sort((a, b) => isMasterFile(a.name) - isMasterFile(b.name));   // the ownership file goes last
  for (const f of files) {
    try {
      const objs = await readFile(f);
      const n = ingest(objs, f.name);
      if (!n) bad.push(f.name); else { rows += n; sources.push(`${f.name}（${n.toLocaleString()}行）`); }
    } catch (e) { bad.push(`${f.name}：${e.message}`); }
  }
  applyRecords(); savedAt = new Date(); rebuild(true);
  saveData();
  recLoad();
  const noXY = [...customers.values()].filter(c => c.lat == null).length;
  let msg = `${files.length}ファイル・${rows.toLocaleString()}行を読み込み、${customers.size.toLocaleString()}人にまとめました。`;
  if (noXY) msg += ` 座標がない ${noXY}人は一覧のみに出ます。`;
  if (bad.length) msg += ` 顧客コードの列が見つからなかったファイル：${bad.join('、')}`;
  toast(msg, 7000);
}

async function odRetry401(fn) {

const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

  lsSet('yame-od-pkce', { verifier, state }); lsSet('yame-login-at', Date.now());
  const q = new URLSearchParams({ client_id: OD.client, response_type: 'code', redirect_uri: OD.redirect, response_mode: 'query',
    scope: OD.scope, state, code_challenge: challenge, code_challenge_method: 'S256', prompt: 'select_account' });

function refreshScope(params) {

  const j = await r.json();
  if (!r.ok) throw new Error(j.error_description || j.error || 'サインインに失敗しました');
  const tok = { access: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in - 120) * 1000, scope: j.scope || '' };
  lsSet('yame-od-tok', tok);

async function odToken() {   // a usable access token, or null when a fresh sign-in is needed
  const t = lsGet('yame-od-tok');

async function odFolderChildrenRaw(token) {

      const host = OD.sharedBase.replace(/^https:\/\/([^/]+)(\/personal\/[^/]+).*$/, '$1:$2');
      const drv = await graph(`/sites/${host}:/drive?$select=id`, token);
      const hit = (await graph(`/drives/${drv.id}/root/search(q='${encodeURIComponent(seg[seg.length - 1])}')?$top=50`, token)).value
        .find(i => i.folder && i.name === seg[seg.length - 1]);
      if (hit) return (await graph(`/drives/${drv.id}/items/${hit.id}/children?$top=200`, token)).value;
    } catch {}
    const names = [...new Set(cands.map(c => c.name))].slice(0, 12).join('、');
    throw new Error(`OneDriveに「${OD.folder}」が見つかりませんでした。共有されているフォルダ：${names || 'なし'}`);
  }
}
/* ---------- 行動記録（お店誌・訪問・所有確認）: entered on the map, kept in OneDrive「記録」, exported as CSV ----------
   Each device appends events to its own file per day (記録/<担当>_<端末>_<日付>.json), so people never overwrite each other.
   Events: put (add/edit a record), del (remove one), done (records entered into 店クラウドV). Customer data never leaves OneDrive/this device. */
const REC_DIR = '記録';
let writerId = lsGet('yame-writer-id');
if (!writerId) { writerId = Math.random().toString(36).slice(2, 8); lsSet('yame-writer-id', writerId); }
let recFiles = lsGet('yame-rec-files') || {};      // file name -> { mod, events } (cache of what is on OneDrive)
let recPending = lsGet('yame-rec-pending') || [];   // events not sent yet
let recLastExport = [];
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function recAllEvents() {
  const seen = new Set(), out = [];
  for (const f of Object.values(recFiles)) for (const e of f.events || []) if (!seen.has(e.id)) { seen.add(e.id); out.push(e); }
  for (const e of recPending) if (!seen.has(e.id)) { seen.add(e.id); out.push(e); }
  return out.sort((a, b) => (a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0));
}
function computeRecords() {
  const recs = new Map(), done = new Set();
  for (const e of recAllEvents()) {
    if (e.op === 'put' && e.rec) recs.set(e.rec.id, e.rec);
    else if (e.op === 'del') recs.delete(e.recId);
    else if (e.op === 'done') for (const id of e.ids || []) done.add(id);
  }
  return { recs, done };
}
// put the records onto the customers (undoing what an earlier pass added first)
function applyRecords() {
  for (const c of customers.values()) {
    c.visits = c.visits.filter(v => !v.fromRec);
    for (const k in c.appl) { c.appl[k] = c.appl[k].filter(a => !a.fromRec); for (const a of c.appl[k]) delete a.recChecked; }
    if ('_cat0' in c) { c.catalog = c._cat0; c.catalogTarget = c._ct0; delete c._cat0; delete c._ct0; }
  }
  const { recs } = computeRecords();
  for (const r of [...recs.values()].sort((a, b) => (a.date < b.date ? -1 : 1))) {
    const c = customers.get(r.code); if (!c) continue;
    const d = r.date ? new Date(r.date + 'T00:00:00') : null;
    if (r.kind === '訪問') c.visits.push({ date: d, staff: r.staff, kind: '訪問', custom: '', fromRec: true });
    else if (r.kind === 'お店誌') {
      if (!('_cat0' in c)) { c._cat0 = c.catalog; c._ct0 = c.catalogTarget; }
      c.catalog = r.staff; c.catalogTarget = true;
    } else if (r.kind === '所有確認') {
      const cat = r.appl === '熱源' ? 'IH' : r.appl;
      const list = (c.appl[cat] ||= []);
      const m = normQ(r.model);
      const same = m && list.find(a => !a.fromRec && normQ(a.model) === m);
      if (same) same.recChecked = d;
      else list.push({ model: r.model || '', date: r.year ? new Date(+r.year, 0, 1) : null, place: r.place || '', store: r.store || '', checked: d, maru: false, fromRec: true });
    }
  }
  finalize();
}
function recRedraw() { applyRecords(); refresh(); if (selected) select(selected, false); renderRecState(); }
function recListHTML(code) {
  const { recs, done } = computeRecords();
  const list = [...recs.values()].filter(r => r.code === code).sort((a, b) => (a.date < b.date ? 1 : -1));
  const pend = new Set(recPending.filter(e => e.op === 'put').map(e => e.rec.id));
  if (!list.length) return '<div class="empty" style="margin-top:6px">この地図からの記録はまだありません</div>';
  return `<ul class="reclist">${list.map(r => {
    const what = r.kind === '所有確認' ? `${esc(r.appl)}${r.maker ? '・' + esc(r.maker) : ''}${r.model ? '・' + esc(r.model) : ''}${r.year ? '・' + esc(r.year) + '年製' : ''}${r.place ? '・' + esc(r.place) : ''}${r.store ? '・' + esc(r.store) : ''}` : '';
    const tags = (done.has(r.id) ? ' <b>入力済</b>' : '') + (pend.has(r.id) ? ' <i>未送信</i>' : '');
    const ops = r.writer === writerId ? `<span class="ops"><button type="button" data-redit="${esc(r.id)}">直す</button><button type="button" data-rdel="${esc(r.id)}">消す</button></span>` : '';
    return `<li><span class="d">${esc(r.date.replace(/-/g, '/'))}</span><span class="t">${esc(r.kind)}・${esc(r.staff)}${what ? '<br>' + what : ''}${r.memo ? '<br>' + esc(r.memo) : ''}${tags}</span>${ops}</li>`;
  }).join('')}</ul>`;
}
function renderRecState() {
  const n = recPending.length;
  $('#recState').textContent = n ? `記録の未送信が${n}件あります（インターネットにつながると自動で送ります）` : '';
}
function recAdd(ev) {
  ev.id = newId(); ev.ts = new Date().toISOString(); ev.writer = writerId;
  recPending.push(ev); lsSet('yame-rec-pending', recPending);
  recRedraw();
  recFlush(true);
}
let recFlushing = false;
// user: the person just pressed 保存 (only then may we send them to the sign-in page, and at most once in 10 minutes)
async function recFlush(user) {
  if (recFlushing || !recPending.length || !odReady() || !navigator.onLine) { renderRecState(); return; }
  recFlushing = true;
  try {
    const sending = recPending.slice();
    const name = `${squash(lsGet('yame-rec-staff') || 'x')}_${writerId}_${isoDay(new Date()).replace(/-/g, '')}.json`;
    const r = await odRetry401(async token => {
      if (!odFolderRef) await odFolderChildren(token);
      const base = `https://graph.microsoft.com/v1.0/drives/${odFolderRef.drive}/items/${odFolderRef.id}:/${encodeURIComponent(REC_DIR)}/${encodeURIComponent(name)}:/content`;
      let existing = [];
      const g = await fetch(base, { headers: { Authorization: 'Bearer ' + token } });
      if (g.ok) existing = await g.json();
      else if (g.status !== 404) { const e = new Error(`記録の読み込みエラー（${g.status}）`); e.status = g.status; throw e; }
      const ids = new Set(existing.map(e => e.id));
      const merged = existing.concat(sending.filter(e => !ids.has(e.id)));
      const p = await fetch(base, { method: 'PUT', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(merged) });
      if (!p.ok) { const e = new Error(`記録を保存できませんでした（${p.status}）`); e.status = p.status; throw e; }
      return merged;
    });
    if (r.needLogin) { if (user) toast('記録を送るにはサインインが必要です。「最新のお客様データを表示」からサインインしてください（記録はこの端末に残しています）', 7000); renderRecState(); return; }
    recFiles[name] = { mod: new Date().toISOString(), events: r.value };
    lsSet('yame-rec-files', recFiles);
    const sent = new Set(sending.map(e => e.id));
    recPending = recPending.filter(e => !sent.has(e.id)); lsSet('yame-rec-pending', recPending);
    recRedraw();
  } catch (e) {
    const t = lsGet('yame-od-tok');
    if (e.status === 403 && !(t && /ReadWrite/i.test(t.scope || ''))) {
      const last = lsGet('yame-rec-relogin') || 0;
      if (user && Date.now() - last > 600000) {
        lsSet('yame-rec-relogin', Date.now());
        toast('記録を保存するには、もう一度サインインが必要です。サインイン画面に移ります', 5000);
        lsSet('yame-od-pending', 'recflush'); setTimeout(odLogin, 1500);
      } else if (user) toast('書き込みの許可がまだ下りていません（管理者の同意待ち）。記録はこの端末に残しています', 7000);
    } else if (e.status === 403) toast('「記録」フォルダに書き込む権限がありません。たかのぶさんに「記録」フォルダを「編集可」で共有してもらってください', 9000);
    else toast(e.message + '（記録はこの端末に残しています）', 6000);
  } finally { recFlushing = false; renderRecState(); }
}
// read everyone's record files (only the ones that changed since last time)
async function recLoad() {
  if (!odReady()) return;
  try {
    const r = await odRetry401(async token => {
      if (!odFolderRef) await odFolderChildren(token);
      let list;
      try { list = (await graph(`/drives/${odFolderRef.drive}/items/${odFolderRef.id}:/${encodeURIComponent(REC_DIR)}:/children?$top=999`, token)).value; }
      catch (e) { if (e.status === 404) return null; throw e; }
      let changed = false;
      const names = new Set();
      for (const f of list.filter(i => i.file && /\.json$/i.test(i.name))) {
        names.add(f.name);
        if (recFiles[f.name] && recFiles[f.name].mod === f.lastModifiedDateTime) continue;
        const ev = await (await fetch(f['@microsoft.graph.downloadUrl'])).json();
        recFiles[f.name] = { mod: f.lastModifiedDateTime, events: Array.isArray(ev) ? ev : [] };
        changed = true;
      }
      for (const n of Object.keys(recFiles)) if (!names.has(n)) { delete recFiles[n]; changed = true; }
      return changed;
    });
    if (r.value) { lsSet('yame-rec-files', recFiles); recRedraw(); }
    recFlush();
  } catch (e) { /* records are optional; the map still works */ }
}
window.addEventListener('online', recFlush);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') recFlush(); });

// CSV for entering into 店クラウドV (Excel opens it as is)
$('#recExport').addEventListener('click', () => { $('#recExportBox').hidden = !$('#recExportBox').hidden; });
$('#recExportGo').addEventListener('click', () => {
  const { recs, done } = computeRecords();
  const onlyNew = $('#recOnlyNew').checked;
  const rows = [...recs.values()].filter(r => !onlyNew || !done.has(r.id))
    .sort((a, b) => (a.date === b.date ? (a.code < b.code ? -1 : 1) : a.date < b.date ? -1 : 1));
  if (!rows.length) { toast('書き出す記録がありません', 3000); return; }

  const q = v => { const s = String(v ?? ''); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [head.join(',')].concat(rows.map(r => [r.date.replace(/-/g, '/'), r.code, r.name, r.staff, r.kind, r.appl, r.maker, r.model, r.year, r.place, r.store,
    r.kind === '所有確認' ? r.date.replace(/-/g, '/') : '', r.memo, r.id, done.has(r.id) ? '済' : ''].map(q).join(',')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `行動記録_${isoDay(new Date()).replace(/-/g, '')}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  recLastExport = rows.filter(r => !done.has(r.id)).map(r => r.id);

async function odShowList() {
  const box = $('#odBox');
  box.hidden = false; box.textContent = 'OneDriveのフォルダを確認しています…';
  try {
    const r = await odRetry401(token => odFolderChildren(token));
    if (r.needLogin) { lsSet('yame-od-pending', true); await odLogin(); return; }
    await odReadSettings(r.value);
    const files = r.value.filter(i => i.file && /\.(xlsx|xls|csv)$/i.test(i.name) && !/^~\$/.test(i.name))
      .sort((a, b) => a.name.localeCompare(b.name, 'ja'));
    if (!files.length) { box.textContent = 'フォルダにExcel・CSVが見つかりませんでした。'; return; }
    const skip = new Set(lsGet('yame-od-skip') || files.filter(f => DEFAULT_SKIP.test(f.name)).map(f => f.name));
    box.innerHTML = '<b>読み込むファイル</b>' + files.map((f, i) =>
      `<label><input type="checkbox" data-i="${i}"${skip.has(f.name) ? '' : ' checked'}><span>${esc(f.name)}<br><span class="d">${fmtDate(new Date(f.lastModifiedDateTime))} 更新</span></span></label>`).join('') +
      '<div class="row"><button class="btn primary" id="odGo" type="button">この内容で読み込む</button><button class="btn" id="odClose" type="button">閉じる</button></div>';
    $('#odClose').onclick = () => { box.hidden = true; };
    $('#odGo').onclick = async () => {
      const boxes = [...box.querySelectorAll('input[data-i]')];
      lsSet('yame-od-skip', boxes.filter(b => !b.checked).map(b => files[+b.dataset.i].name));
      const pick = boxes.filter(b => b.checked).map(b => files[+b.dataset.i]);
      if (!pick.length) { toast('ファイルを1つ以上選んでください', 3000); return; }
      box.textContent = `${pick.length}ファイルをダウンロードしています…`;
      try {
        const got = [];
        for (const f of pick) {
          const r = await fetch(f['@microsoft.graph.downloadUrl']);
          if (!r.ok) throw new Error(`${f.name} をダウンロードできませんでした`);
          got.push(new File([await r.blob()], f.name));
        }
        box.hidden = true;
        freshNext = true;
        await importFiles(got);
      } catch (e) { box.textContent = e.message; }
    };
  } catch (e) {
    box.textContent = e.message;
    if (e.status === 401) { box.textContent += '（もう一度押すとサインインからやり直します）'; lsSet('yame-od-tok', null); }
  }
}

// 現在地: centre once on press, then keep the blue dot following the phone
let meDot = null, meRing = null, meWatch = null, meCentre = false;
function showMe(p) {
  const ll = [p.coords.latitude, p.coords.longitude], acc = p.coords.accuracy || 0;
  if (!meDot) {
    meRing = L.circle(ll, { radius: acc, color: '#1a73e8', weight: 1, fillColor: '#1a73e8', fillOpacity: 0.12, interactive: false }).addTo(map);
    meDot = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1, interactive: false }).addTo(map);
  } else { meDot.setLatLng(ll); meRing.setLatLng(ll).setRadius(acc); }
  if (meCentre) { meCentre = false; map.setView(ll, Math.max(map.getZoom(), 16)); }
}
function meError(e) {
